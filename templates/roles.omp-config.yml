# Two blocks of OMP model roles. Pick ids from `omp models`; leave a role out to
# use its fallback.
#
# 1. smode's roles (ADR-0003). Put these in the USER config,
#    ~/.omp/agent/config.yml: OMP approves a per-call model only when a
#    user-level role names it, so smode reads the exact model from here and
#    passes it to the bundled `task`, `scout` or `reviewer` agent. smode's Setup
#    playbook writes them.
#
# 2. The factory v1 role agents (planner, implementer, verifier, reviewer).
#    Copy these into the project's .omp/config.yml. Add only custom roles there:
#    a built-in role (task, slow, default, ...) set in a project changes every
#    subagent in that project. Fallbacks: planner -> @plan, implementer -> @task,
#    verifier and reviewer -> @slow.
modelRoles:
  # 1. smode (user config)
  scout: <provider>/<model>:<level> # fast, cheap reading and searching
  worker: <provider>/<model>:<level> # reliable code changes and test loops
  thinker: <provider>/<model>:<level> # plans, diagnosis, design
  reviewer: <provider>/<model>:<level> # reviews and verification; not the worker's model family
  coordinator: <provider>/<model>:<level> # steady, cheap; runs many workers
  # 2. factory v1 (project config)
  planner: <provider>/<model>:<level>
  implementer: <provider>/<model>:<level>
  verifier: <provider>/<model>:<level> # not the implementer's model
